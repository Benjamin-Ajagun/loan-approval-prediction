[project]
name = "loan-approval-prediction"
version = "0.1.0"
description = "Machine learning project for predicting loan approval"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "kagglehub>=0.3.0",
    "scikit-learn>=1.4.0"
]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.environment]
PYTHONWARNINGS = "ignore"
PIP_DISABLE_PIP_VERSION_CHECK = "1"